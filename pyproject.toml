[project]
name = "memory-mcp"
version = "0.1.0"
description = "MCP memory server: atomic long-term memory for AI agents (SQLite + FTS5 + hybrid vector search via local Ollama)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.scripts]
memory-mcp = "memory_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_mcp"]
