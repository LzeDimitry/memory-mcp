# Codex CLI: add to ~/.codex/config.toml
# (shared between Codex CLI and the IDE extension)

[mcp_servers.memory]
command = "uv"
args = ["--directory", "/home/ras/.memory-mcp", "run", "memory-mcp"]

# Optional: pin a per-project database instead of the default
# <cwd>/.memory/memories.db
# [mcp_servers.memory.env]
# MEMORY_MCP_DB_PATH = "/path/to/project/.memory/memories.db"
